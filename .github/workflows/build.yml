name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPILE_SDK: '37'
  BUILD_TOOLS: '36.0.0'
  GRADLE_VERSION: '8.13'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Hosted ubuntu runners ship an Android SDK (cmdline-tools + platform-tools).
      # We install the compile SDK / build-tools explicitly; Gradle may also
      # auto-download any missing component once licenses are accepted below.
      - name: Prepare Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; letting Gradle auto-download SDK components"
            exit 0
          fi
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # compileSdk 37 may live on the preview channel depending on the runner image
          "$SDKMANAGER" "platforms;android-${COMPILE_SDK}" \
            || "$SDKMANAGER" --channel=3 "platforms;android-${COMPILE_SDK}" \
            || echo "WARN: platforms;android-${COMPILE_SDK} unavailable; Gradle will try to download it"
          "$SDKMANAGER" "build-tools;${BUILD_TOOLS}" || true
          "$SDKMANAGER" "build-tools;35.0.0" || true
          "$SDKMANAGER" "platform-tools" || true

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Read APK version info
        id: meta
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2="$(ls -d "${ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | tail -1)"
          if [ -z "$AAPT2" ]; then
            AAPT2="$(ls -d /usr/local/lib/android/sdk/build-tools/*/aapt2 | tail -1)"
          fi
          "$AAPT2" dump badging "$APK" | head -1
          VERSION="$("$AAPT2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardPersonality-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: CardPersonality-debug-apk
          path: apk

      - name: Prepare release asset
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if [ -z "$VERSION" ]; then echo "version output missing" >&2; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp apk/app-debug.apk "CardPersonality-v${VERSION}.apk"
          sha256sum "CardPersonality-v${VERSION}.apk" > "CardPersonality-v${VERSION}.apk.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            CardPersonality-v${{ env.VERSION }}.apk
            CardPersonality-v${{ env.VERSION }}.apk.sha256
            NOTICE.md
