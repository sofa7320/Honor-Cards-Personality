name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPILE_SDK: '37'
  BUILD_TOOLS: '36.0.0'
  GRADLE_VERSION: '8.13'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "build-tools;35.0.0" \
            "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Read APK version info
        id: meta
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)"
          "$AAPT2" dump badging "$APK" | head -1
          VERSION="$("$AAPT2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CardPersonality-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: CardPersonality-debug-apk
          path: apk

      - name: Prepare release asset
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if [ -z "$VERSION" ]; then echo "version output missing" >&2; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp apk/app-debug.apk "CardPersonality-v${VERSION}.apk"
          sha256sum "CardPersonality-v${VERSION}.apk" > "CardPersonality-v${VERSION}.apk.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            CardPersonality-v${{ env.VERSION }}.apk
            CardPersonality-v${{ env.VERSION }}.apk.sha256
            NOTICE.md
